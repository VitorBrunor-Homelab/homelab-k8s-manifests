apiVersion: apps/v1
kind: Deployment
metadata:
  name: minimal-api-deployment
  namespace: default
spec:
  replicas: 1 # Começaremos com 1 para o teste
  selector:
    matchLabels:
      app: minimal-api
  template:
    metadata:
      labels:
        app: minimal-api
    spec:
      containers:
      - name: minimal-api-container
        image: harbor.homelab.local/test-api/minimal-api:e25e88f91dd277069bd489738b453e7d226e7ab0
        ports:
        - containerPort: 8080 # A porta que expomos no Dockerfile
