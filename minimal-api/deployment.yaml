apiVersion: apps/v1
kind: Deployment
metadata:
  name: minimal-api-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minimal-api
  template:
    metadata:
      labels:
        app: minimal-api
    spec:
      containers:
      - name: minimal-api-container
        image: harbor.homelab.local/test-api/minimal-api:8f2e686d6b6038c89a52f7d1bcd57456c55fe7c0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
